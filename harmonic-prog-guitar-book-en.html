tyle="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="988.0" y="193.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">G♯/A♭</text><rect x="1056.0" y="170.0" width="88" height="40" rx="20.0" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic);stroke-width:2"/><text x="1100.0" y="195.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">A</text><rect x="1166.0" y="170.0" width="92" height="40" rx="20.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="1212.0" y="193.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">A♯/B♭</text><rect x="1280.0" y="170.0" width="88" height="40" rx="20.0" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic);stroke-width:2"/><text x="1324.0" y="195.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">B</text><text x="148" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">T</text><text x="148" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">whole</text><text x="372" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">T</text><text x="372" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">whole</text><text x="596" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--dom)">S</text><text x="596" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">half</text><text x="708" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">T</text><text x="708" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">whole</text><text x="932" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">T</text><text x="932" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">whole</text><text x="1156" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">T</text><text x="1156" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">whole</text><text x="1380" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="var(--dom)">S</text><text x="1380" y="274" font-size="9" fill="var(--muted)" text-anchor="middle">half</text><text x="92" y="320" font-size="11.5" fill="var(--muted)" text-anchor="start">The major scale = whole–whole–half–whole–whole–whole–half (from C: the white piano keys). An octave = 12 semitones = the same tone up.</text><text x="92" y="342" font-size="11.5" fill="var(--muted)" text-anchor="start">A key = the same tones transposed anywhere (the pattern holds): G major = one sharp (F♯) only, D major = F♯+C♯, etc.</text><text x="92" y="364" font-size="11.5" fill="var(--muted)" text-anchor="start">On the guitar a semitone = one fret; a whole step = two frets. The ♯/♭ signs shift a tone by a half step.</text><rect x="60" y="400" width="1404" height="300" rx="10" class="panel"/><text x="90" y="438" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Major vs. minor — same tones, different home</text><text x="92" y="480" font-size="13" fill="var(--fg)" text-anchor="start" font-weight="700">C major</text><rect x="148.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:var(--tonicbg);stroke:var(--line);stroke-width:2"/><text x="180.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">C</text><rect x="260.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="292.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">D</text><rect x="372.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="404.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">E</text><rect x="484.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="516.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">F</text><rect x="596.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="628.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">G</text><rect x="708.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="740.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">A</text><rect x="820.0" y="457.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="852.0" y="479.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">B</text><text x="92" y="540" font-size="13" fill="var(--fg)" text-anchor="start" font-weight="700">A minor</text><rect x="148.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:var(--vinbg);stroke:var(--vin);stroke-width:2"/><text x="180.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">A</text><text x="268" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">S</text><rect x="260.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="292.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">B</text><text x="380" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">T</text><rect x="372.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="404.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">C</text><text x="492" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">T</text><rect x="484.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="516.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">D</text><text x="604" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">S</text><rect x="596.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="628.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">E</text><text x="716" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">T</text><rect x="708.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="740.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">F</text><text x="828" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">T</text><rect x="820.0" y="517.0" width="64" height="34" rx="17.0" class="chip" style="fill:#f4f2ec;stroke:var(--line);stroke-width:1"/><text x="852.0" y="539.0" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">G</text><text x="92" y="606" font-size="11.5" fill="var(--muted)" text-anchor="start">A minor = the RELATIVE MINOR of C major: the same seven tones, but tonic = A. The minor pattern: whole–half–whole–whole–half–whole–whole.</text><text x="92" y="628" font-size="11.5" fill="var(--muted)" text-anchor="start">In sound: major = bright/open, minor = darker; the difference is not the tones but where the song calls home.</text><text x="92" y="678" font-size="11" fill="#b04a2f" text-anchor="start">A note on names: Czech tradition says H where we say B natural (B♭ = their B). The repo diagrams keep international names (B, B♭).</text><rect x="60" y="720" width="1404" height="310" rx="10" class="panel"/><text x="90" y="758" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Chord construction: three tones stacked in thirds</text><circle cx="150" cy="880" r="17" style="fill:var(--tonic);opacity:0.15"/><text x="150" y="885" text-anchor="middle" class="label" font-size="13" fill="var(--tonic)">C</text><line x1="150" y1="843" x2="150" y2="861" stroke="var(--line)" stroke-width="1.4"/><text x="159" y="856" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="150" cy="824" r="17" style="fill:var(--tonic);opacity:0.15"/><text x="150" y="829" text-anchor="middle" class="label" font-size="13" fill="var(--tonic)">E</text><line x1="150" y1="787" x2="150" y2="805" stroke="var(--line)" stroke-width="1.4"/><text x="159" y="800" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="150" cy="768" r="17" style="fill:var(--tonic);opacity:0.15"/><text x="150" y="773" text-anchor="middle" class="label" font-size="13" fill="var(--tonic)">G</text><text x="194" y="822" font-size="16" fill="var(--fg)" text-anchor="start">C = C·E·G</text><text x="194" y="842" font-size="10.5" fill="var(--muted)" text-anchor="start">major: a major third + a minor one (4+3 semitones)</text><circle cx="530" cy="880" r="17" style="fill:var(--vin);opacity:0.15"/><text x="530" y="885" text-anchor="middle" class="label" font-size="13" fill="var(--vin)">A</text><line x1="530" y1="843" x2="530" y2="861" stroke="var(--line)" stroke-width="1.4"/><text x="539" y="856" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="530" cy="824" r="17" style="fill:var(--vin);opacity:0.15"/><text x="530" y="829" text-anchor="middle" class="label" font-size="13" fill="var(--vin)">C</text><line x1="530" y1="787" x2="530" y2="805" stroke="var(--line)" stroke-width="1.4"/><text x="539" y="800" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="530" cy="768" r="17" style="fill:var(--vin);opacity:0.15"/><text x="530" y="773" text-anchor="middle" class="label" font-size="13" fill="var(--vin)">E</text><text x="574" y="822" font-size="16" fill="var(--fg)" text-anchor="start">Am = A·C·E</text><text x="574" y="842" font-size="10.5" fill="var(--muted)" text-anchor="start">minor: a minor third + a major one (3+4)</text><circle cx="910" cy="880" r="17" style="fill:var(--muted);opacity:0.15"/><text x="910" y="885" text-anchor="middle" class="label" font-size="13" fill="var(--muted)">B</text><line x1="910" y1="843" x2="910" y2="861" stroke="var(--line)" stroke-width="1.4"/><text x="919" y="856" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="910" cy="824" r="17" style="fill:var(--muted);opacity:0.15"/><text x="910" y="829" text-anchor="middle" class="label" font-size="13" fill="var(--muted)">D</text><line x1="910" y1="787" x2="910" y2="805" stroke="var(--line)" stroke-width="1.4"/><text x="919" y="800" font-size="9.5" fill="var(--muted)" text-anchor="start">3</text><circle cx="910" cy="768" r="17" style="fill:var(--muted);opacity:0.15"/><text x="910" y="773" text-anchor="middle" class="label" font-size="13" fill="var(--muted)">F</text><text x="954" y="822" font-size="16" fill="var(--fg)" text-anchor="start">Bdim = B·D·F</text><text x="954" y="842" font-size="10.5" fill="var(--muted)" text-anchor="start">dim: two minor thirds (3+3) — tense, doubly flat</text><text x="92" y="1000" font-size="11.5" fill="var(--muted)" text-anchor="start">A seventh = add one more third (C7 = C·E·G·B♭) — very common in blues. A chord is named after its lowest tone (its root).</text></svg></div><div class="page"><span class="pgno">s. 3</span><svg viewBox="0 0 1500 1062" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--dom)"/></marker></defs><text x="120" y="52" font-size="24" fill="var(--fg)" text-anchor="start">Chord functions & the circle</text><path d="M 469.0 363.9 A 238 238 0 0 0 350.0 332.0" class="hedge" marker-end="url(#arr)"/><text x="423.0" y="297.6" text-anchor="middle" font-size="10" fill="var(--dom)">the dominant pull (V→I)</text><rect x="327.0" y="339.0" width="46" h  x="161.2" y="682.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">A♭/G♯</text><rect x="101.0" y="557.0" width="62" height="26" rx="13.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="132.0" y="573.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">E♭</text><rect x="130.2" y="448.0" width="62" height="26" rx="13.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="161.2" y="464.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">B♭</text><rect x="218.0" y="368.2" width="46" height="26" rx="13.0" class="chip" style="fill:var(--subbg);stroke:var(--sub);stroke-width:2"/><text x="241.0" y="386.2" text-anchor="middle" class="label" font-size="14" fill="var(--fg)">F</text><rect x="333.0" y="464.0" width="34" height="20" rx="10.0" class="chip" style="fill:var(--vinbg);stroke:var(--vin);stroke-width:2"/><text x="350.0" y="477.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Am</text><rect x="381.0" y="476.9" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="398.0" y="490.3" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Em</text><rect x="416.1" y="512.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="433.1" y="525.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Bm</text><rect x="429.0" y="560.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="446.0" y="573.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">F♯m</text><rect x="416.1" y="608.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="433.1" y="621.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">C♯m</text><rect x="381.0" y="643.1" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="398.0" y="656.6" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">G♯m</text><rect x="327.0" y="656.0" width="46" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="350.0" y="669.1" text-anchor="middle" class="label" font-size="8.5" fill="var(--fg)">D♯m/E♭m</text><rect x="285.0" y="643.1" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="302.0" y="656.6" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">B♭m</text><rect x="249.9" y="608.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="266.9" y="621.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Fm</text><rect x="237.0" y="560.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="254.0" y="573.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Cm</text><rect x="249.9" y="512.0" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="266.9" y="525.4" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Gm</text><rect x="285.0" y="476.9" width="34" height="20" rx="10.0" class="chip" style="fill:#ecf0f4;stroke:var(--line);stroke-width:1"/><text x="302.0" y="490.3" text-anchor="middle" class="label" font-size="9.5" fill="var(--fg)">Dm</text><circle cx="350.0" cy="570.0" r="255" fill="none" stroke="#d7d3c8" stroke-width="1"/><circle cx="350.0" cy="570.0" r="132" fill="none" stroke="#d7d3c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/><text x="350" y="852" font-size="10.5" fill="var(--muted)" text-anchor="middle">The C major example: V (G) = the clockwise neighbour, IV (F) on the left,</text><text x="350" y="868" font-size="10.5" fill="var(--muted)" text-anchor="middle">vi (Am) inside the ring — the whole circle works identically for every key.</text><rect x="688" y="88" width="782" height="320" rx="10" class="panel"/><text x="712" y="122" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Functions = chord roles inside a key</text><rect x="700.0" y="138.0" width="104" height="30" rx="15.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="752.0" y="157.5" text-anchor="middle" class="label" font-size="12.5" fill="var(--fg)">I</text><text x="836" y="161" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">tonic</text><text x="970" y="161" font-size="12.5" fill="var(--muted)" text-anchor="start">home, rest — the song rests on it</text><rect x="700.0" y="186.0" width="104" height="30" rx="15.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="752.0" y="205.5" text-anchor="middle" class="label" font-size="12.5" fill="var(--fg)">IV</text><text x="836" y="209" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">subdominant</text><text x="970" y="209" font-size="12.5" fill="var(--muted)" text-anchor="start">moving away — opens up, a fresh breath</text><rect x="700.0" y="234.0" width="104" height="30" rx="15.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="752.0" y="253.5" text-anchor="middle" class="label" font-size="12.5" fill="var(--fg)">V</text><text x="836" y="257" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">dominant</text><text x="970" y="257" font-size="12.5" fill="var(--muted)" text-anchor="start">tension — pulls back to the tonic (V→I)</text><rect x="700.0" y="282.0" width="104" height="30" rx="15.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="752.0" y="301.5" text-anchor="middle" class="label" font-size="12.5" fill="var(--fg)">vi</text><text x="836" y="305" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">relative minor</text><text x="970" y="305" font-size="12.5" fill="var(--muted)" text-anchor="start">a second home — colours the song minor</text><rect x="700.0" y="330.0" width="104" height="30" rx="15.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="752.0" y="349.5" text-anchor="middle" class="label" font-size="12.5" fill="var(--fg)">ii·iii·vii°</text><text x="836" y="353" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">a side role</text><text x="970" y="353" font-size="12.5" fill="var(--muted)" text-anchor="start">bridges, colors, turnarounds</text><rect x="688" y="428" width="782" height="200" rx="10" class="panel"/><text x="712" y="462" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Cadences — typical pulls (in C major)</text><text x="712" y="502" font-size="14.5" font-weight="700" fill="var(--dom)">V → I</text><text x="930" y="502" font-size="14.5" fill="var(--fg)" text-anchor="start">G → C</text><text x="1458" y="502" font-size="11" fill="var(--muted)" text-anchor="end">the firm resolution</text><text x="712" y="542" font-size="14.5" font-weight="700" fill="var(--sub)">IV → I</text><text x="930" y="542" font-size="14.5" fill="var(--fg)" text-anchor="start">F → C</text><text x="1458" y="542" font-size="11" fill="var(--muted)" text-anchor="end">the plagal "Amen"</text><text x="712" y="582" font-size="14.5" font-weight="700" fill="var(--muted)">ii – V – I</text><text x="930" y="582" font-size="14.5" fill="var(--fg)" text-anchor="start">Dm – G → C</text><text x="1458" y="582" font-size="11" fill="var(--muted)" text-anchor="end">a jazz turnaround</text><rect x="688" y="648" width="782" height="320" rx="10" class="panel"/><text x="712" y="682" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Minor roles (in A minor)</text><text x="712" y="718" font-size="13.5" fill="var(--tonic)" text-anchor="start" font-weight="700">i tonic</text><text x="1000" y="718" font-size="12.5" fill="var(--muted)" text-anchor="start">the home (Am)</text><text x="712" y="762" font-size="13.5" fill="var(--sub)" text-anchor="start" font-weight="700">iv + VI</text><text x="1000" y="762" font-size="12.5" fill="var(--muted)" text-anchor="start">the subdominant (Dm, F)</text><text x="712" y="806" font-size="13.5" fill="var(--dom)" text-anchor="start" font-weight="700">v minor dominant</text><text x="1000" y="806" font-size="12.5" fill="var(--muted)" text-anchor="start">soft: Em — it glides, no push</text><text x="712" y="850" font-size="13.5" fill="var(--dom)" text-anchor="start" font-weight="700">V7, the sharp dominant</text><text x="1000" y="850" font-size="12.5" fill="var(--muted)" text-anchor="start">E7 = E-G♯-B-D: G♯ = the raised 7th</text><text x="712" y="894" font-size="13.5" fill="var(--vin)" text-anchor="start" font-weight="700">III, the major sibling</text><text x="1000" y="894" font-size="12.5" fill="var(--muted)" text-anchor="start">the "escape door" (C)</text><text x="712" y="942" font-size="12" fill="var(--fg)" text-anchor="start" font-weight="700">HARMONIC MINOR = a raised 7th (the 7th degree; A minor: G→G♯) — the dominant rises from v (Em) to V7 (E7)</text><text x="712" y="960" font-size="12" fill="var(--muted)" text-anchor="start">and the v→i pull then sounds like a major V→I. Skip ii° (Bdim) on guitar — iv (Dm) fills in fine.</text><text x="92" y="898" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">Why the circle works: clockwise = a fifth (7), counterclockwise = a fourth (5).</text><text x="92" y="920" font-size="12" fill="var(--muted)" text-anchor="start">Each clockwise step adds one ♯, counterclockwise drops one ♭.</text><text x="92" y="940" font-size="12" fill="var(--muted)" text-anchor="start">Sharps: F♯ C♯ G♯ D♯ A♯ E♯ B♯ · flats: B♭ E♭ A♭ D♭ G♭ C♭ F♭.</text><text x="92" y="960" font-size="12" fill="var(--muted)" text-anchor="start">Circle of fifths = a map of relations: V = home, IV = look around, vi = sadness, III = escape.</text></svg></div><div class="page"><span class="pgno">s. 4</span><svg viewBox="0 0 1500 1062" xmlns="http://www.w3.org/2000/svg"><text x="120" y="52" font-size="24" fill="var(--fg)" text-anchor="start">Fretboard practice — diagrams, barre, capo and transposing progressions</text><rect x="60" y="80" width="700" height="420" rx="10" class="panel"/><text x="90" y="118" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">How to read the chord diagrams</text><line x1="150" y1="170" x2="150" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="166" y1="170" x2="166" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="182" y1="170" x2="182" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="198" y1="170" x2="198" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="214" y1="170" x2="214" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="230" y1="170" x2="230" y2="250" stroke="var(--line)" stroke-width="1"/><line x1="150" y1="170" x2="230" y2="170" stroke="#b6b2a6" stroke-width="0.8"/><line x1="150" y1="190" x2="230" y2="190" stroke="#b6b2a6" stroke-width="0.8"/><line x1="150" y1="210" x2="230" y2="210" stroke="#b6b2a6" stroke-width="0.8"/><line x1="150" y1="230" x2="230" y2="230" stroke="#b6b2a6" stroke-width="0.8"/><line x1="150" y1="250" x2="230" y2="250" stroke="#b6b2a6" stroke-width="0.8"/><line x1="150" y1="170" x2="230" y2="170" stroke="var(--fg)" stroke-width="2.6"/><text x="150" y="158" font-size="10" fill="#8a8074" text-anchor="middle">✕</text><text x="198" y="158" font-size="10" fill="var(--line)" text-anchor="middle">○</text><text x="214" y="158" font-size="10" fill="var(--line)" text-anchor="middle">○</text><circle cx="166" cy="230" r="6.5" fill="var(--fg)"/><circle cx="182" cy="210" r="6.5" fill="var(--fg)"/><circle cx="214" cy="190" r="6.5" fill="var(--fg)"/><text x="190" y="280" font-size="16" fill="var(--fg)" text-anchor="middle" font-weight="700">C</text><text x="330" y="184" font-size="11.5" fill="var(--muted)" text-anchor="start">the thick top line = fret 0 (the nut)</text><text x="330" y="208" font-size="11.5" fill="var(--muted)" text-anchor="start">✕ = don't pluck, ○ = open string</text><text x="330" y="232" font-size="11.5" fill="var(--muted)" text-anchor="start">a dot = a fingertip; the columns = strings</text><text x="330" y="256" font-size="11.5" fill="var(--fg)" text-anchor="start" font-weight="700">E A D G B e  (left = lowest → highest)</text><text x="330" y="292" font-size="11.5" fill="var(--dom)" text-anchor="start">on barres: the left number = the starting fret</text><text x="92" y="352" font-size="11.5" fill="var(--muted)" text-anchor="start">Notes on the guitar: every fret = a semitone. Open strings: E(6th) A(5th) D(4th) G(3rd) B(2nd) e(1st).</text><text x="92" y="376" font-size="11.5" fill="var(--muted)" text-anchor="start">A chord = 3–5 strings at once; a muted string (✕) just stays dead — the rest ringing is fine.</text><text x="92" y="400" font-size="11" fill="#b04a2f" text-anchor="start">The diagrams keep international names (B, B♭); Czech players often say H for B natural.</text><text x="92" y="430" font-size="11.5" fill="var(--muted)" text-anchor="start">A barre = one finger across all strings → one shape anywhere on the neck.</text><rect x="780" y="80" width="684" height="420" rx="10" class="panel"/><text x="806" y="118" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Barre shapes and the capo</text><line x1="856" y1="150" x2="856" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="870" y1="150" x2="870" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="884" y1="150" x2="884" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="898" y1="150" x2="898" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="912" y1="150" x2="912" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="926" y1="150" x2="926" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="856" y1="150" x2="926" y2="150" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="168" x2="926" y2="168" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="186" x2="926" y2="186" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="204" x2="926" y2="204" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><text x="856" y="147" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="870" cy="177" r="5" fill="var(--fg)"/><circle cx="884" cy="177" r="5" fill="var(--fg)"/><circle cx="898" cy="159" r="5" fill="var(--fg)"/><text x="912" y="147" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><text x="926" y="147" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="856" cy="159" r="4.4" fill="none" stroke="var(--tonic)" stroke-width="2"/><text x="891" y="226" font-size="12" fill="var(--fg)" text-anchor="middle" font-weight="700">E major</text><text x="942" y="226" font-size="8.5" fill="var(--muted)" text-anchor="start">F=1·G=3·A=5·B=7·C=8·D=10</text><text x="942" y="242" font-size="8.5" fill="var(--muted)" text-anchor="start">tonic on string 6</text><line x1="1156" y1="150" x2="1156" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1170" y1="150" x2="1170" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1184" y1="150" x2="1184" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1198" y1="150" x2="1198" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1212" y1="150" x2="1212" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1226" y1="150" x2="1226" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1156" y1="150" x2="1226" y2="150" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="168" x2="1226" y2="168" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="186" x2="1226" y2="186" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="204" x2="1226" y2="204" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><text x="1156" y="147" font-size="8.5" fill="#8a8074" text-anchor="middle">✕</text><text x="1170" y="147" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="1184" cy="177" r="5" fill="var(--fg)"/><circle cx="1198" cy="177" r="5" fill="var(--fg)"/><circle cx="1212" cy="177" r="5" fill="var(--fg)"/><text x="1226" y="147" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="1170" cy="159" r="4.4" fill="none" stroke="var(--tonic)" stroke-width="2"/><text x="1191" y="226" font-size="12" fill="var(--fg)" text-anchor="middle" font-weight="700">A major</text><text x="1242" y="226" font-size="8.5" fill="var(--muted)" text-anchor="start">B=2·C=3·D=5·E=7·F=8</text><text x="1242" y="242" font-size="8.5" fill="var(--muted)" text-anchor="start">tonic on string 5</text><line x1="856" y1="320" x2="856" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="870" y1="320" x2="870" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="884" y1="320" x2="884" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="898" y1="320" x2="898" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="912" y1="320" x2="912" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="926" y1="320" x2="926" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="856" y1="320" x2="926" y2="320" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="338" x2="926" y2="338" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="356" x2="926" y2="356" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="856" y1="374" x2="926" y2="374" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><text x="856" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="870" cy="347" r="5" fill="var(--fg)"/><circle cx="884" cy="347" r="5" fill="var(--fg)"/><text x="898" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><text x="912" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><text x="926" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="856" cy="329" r="4.4" fill="none" stroke="var(--tonic)" stroke-width="2"/><text x="891" y="396" font-size="12" fill="var(--fg)" text-anchor="middle" font-weight="700">Em minor</text><text x="942" y="396" font-size="8.5" fill="var(--muted)" text-anchor="start">F♯m=2·Gm=3·Am=5·Bm=7</text><text x="942" y="412" font-size="8.5" fill="var(--muted)" text-anchor="start">tonic on string 6</text><line x1="1156" y1="320" x2="1156" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1170" y1="320" x2="1170" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1184" y1="320" x2="1184" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1198" y1="320" x2="1198" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1212" y1="320" x2="1212" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1226" y1="320" x2="1226" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.45"/><line x1="1156" y1="320" x2="1226" y2="320" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="338" x2="1226" y2="338" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="356" x2="1226" y2="356" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><line x1="1156" y1="374" x2="1226" y2="374" stroke="#b6b2a6" stroke-width="0.7" opacity="0.6"/><text x="1156" y="317" font-size="8.5" fill="#8a8074" text-anchor="middle">✕</text><text x="1170" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="1184" cy="347" r="5" fill="var(--fg)"/><circle cx="1198" cy="347" r="5" fill="var(--fg)"/><circle cx="1212" cy="329" r="5" fill="var(--fg)"/><text x="1226" y="317" font-size="8.5" fill="var(--line)" text-anchor="middle">○</text><circle cx="1170" cy="329" r="4.4" fill="none" stroke="var(--tonic)" stroke-width="2"/><text x="1191" y="396" font-size="12" fill="var(--fg)" text-anchor="middle" font-weight="700">Am minor</text><text x="1242" y="396" font-size="8.5" fill="var(--muted)" text-anchor="start">Bm=2·Cm=3·Dm=5·Em=7</text><text x="1242" y="412" font-size="8.5" fill="var(--muted)" text-anchor="start">tonic on string 5</text><text x="806" y="447" font-size="12" fill="var(--fg)" text-anchor="start" font-weight="700">CAPO = the clamp: it shortens all strings at fret N → easy-key shapes play N semitones up.</text><text x="806" y="466" font-size="12" fill="var(--muted)" text-anchor="start">Easy major shapes: C · G · D · A · E — easy minor shapes: Am · Em. Everything else = the same shapes + a capo.</text><text x="806" y="484" font-size="12" fill="var(--muted)" text-anchor="start">Choosing: the nearest easy key = fewer barre frets (e.g. B♭ minor: capo 1 + A-minor shapes).</text><rect x="60" y="540" width="1404" height="500" rx="10" class="panel"/><text x="90" y="578" font-size="16" fill="var(--fg)" text-anchor="start" font-weight="700">Transposing a progression into any key — step by step</text><rect x="120" y="598" width="34" height="34" rx="8" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic)"/><text x="137" y="620" text-anchor="middle" class="label" font-size="14" fill="var(--tonic)">1</text><text x="178" y="618" font-size="14" fill="var(--fg)" text-anchor="start" font-weight="700">Pick a progression</text><text x="420" y="618" font-size="12.5" fill="var(--muted)" text-anchor="start">e.g. the pop four-chord I–V–vi–IV</text><rect x="120" y="650" width="34" height="34" rx="8" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic)"/><text x="137" y="672" text-anchor="middle" class="label" font-size="14" fill="var(--tonic)">2</text><text x="178" y="670" font-size="14" fill="var(--fg)" text-anchor="start" font-weight="700">Find the tonic on the circle</text><text x="420" y="670" font-size="12.5" fill="var(--muted)" text-anchor="start">your target key (anywhere on the circle)</text><rect x="120" y="702" width="34" height="34" rx="8" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic)"/><text x="137" y="724" text-anchor="middle" class="label" font-size="14" fill="var(--tonic)">3</text><text x="178" y="722" font-size="14" fill="var(--fg)" text-anchor="start" font-weight="700">Read the neighbourhood</text><text x="420" y="722" font-size="12.5" fill="var(--muted)" text-anchor="start">V = clockwise, IV = counterclockwise, vi = the inner chip below the tonic</text><rect x="120" y="754" width="34" height="34" rx="8" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic)"/><text x="137" y="776" text-anchor="middle" class="label" font-size="14" fill="var(--tonic)">4</text><text x="178" y="774" font-size="14" fill="var(--fg)" text-anchor="start" font-weight="700">Rewrite the chords</text><text x="420" y="774" font-size="12.5" fill="var(--muted)" text-anchor="start">the same romans, new names</text><rect x="120" y="806" width="34" height="34" rx="8" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic)"/><text x="137" y="828" text-anchor="middle" class="label" font-size="14" fill="var(--tonic)">5</text><text x="178" y="826" font-size="14" fill="var(--fg)" text-anchor="start" font-weight="700">Pick shapes or a capo</text><text x="420" y="826" font-size="12.5" fill="var(--muted)" text-anchor="start">easy-key open shapes + a capo, or a barre</text><text x="92" y="892" font-size="12.5" fill="var(--fg)" text-anchor="start" font-weight="700">Example: the four-chord I–V–vi–IV in E major (C → E = shifted 4 semitones): E – B – C♯m – A; the easy route: capo 4 + C-major shapes.</text><text x="92" y="920" font-size="12.5" fill="var(--muted)" text-anchor="start">Minor-key tricks: ii° → replace with iv · v → V7 (harmonic minor, raised 7th) · the Andalusian cadence i–VII–VI–V = a minor descent from home.</text><text x="92" y="948" font-size="12.5" fill="var(--muted)" text-anchor="start">Blues (12 bars): major: I×4–IV×2–I×2–V–IV–I–V · minor: i×4–iv×2–i×2–V7–iv–i–V7 (V7 = the raised 7th).</text><text x="92" y="976" font-size="12" fill="var(--muted)" text-anchor="start">Play the progressions slowly at 60 BPM and change chords on the beat. Colours in the diagrams = chord functions → your eyes find them fast.</text></svg></div><div class="page"><span class="pgno">s. 5</span><svg viewBox="0 0 1500 1062" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--dom)"/></marker></defs><text x="120" y="46" class="title" font-size="24">Chord progressions in C major</text><text x="120" y="66" class="subtitle" font-size="12.5">Circle of fifths · chord functions · proven progressions · barre transposition</text><path d="M 469.0 363.9 A 238 238 0 0 0 350.0 332.0" class="hedge" marker-end="url(#arr)"/><text x="423.0" y="297.6" text-anchor="middle" font-size="10" fill="var(--dom)">the dominant pull (V→I)</text><rect x="319.0" y="339.0" width="62" height="26" rx="13.0" class="chip" style="fill:var(--tonicbg);stroke:var(--tonic);stroke-width:2"/><text x="350.0" y="355.8" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">C</text><rect x="428.0" y="368.2" width="62" height="26" rx="13.0" class="chip" style="fill:var(--dombg);stroke:var(--dom);stroke-width:2"/><text x="459.0" y="385.0" text-anchor="middle" class="label" font-size="10.5" fill="var(--fg)">G</text><rect x="507.8" y="448.0" width="62" height="26" rx="13.0" class="chip" style="fill:var(--neutral);stroke:var(--line);stroke-width:1"/><text x="538.8" y="464.8" text-anchor="midd
