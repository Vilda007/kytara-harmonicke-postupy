<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harmonické postupy na kytaru</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f5;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e8e4d8;
    --tonic: #2f6b4f;
    --sub: #8a6d3b;
    --dom: #b04a2f;
    --vin: #5b6478;
    --tonicbg: #d8ecdf;
    --subbg: #f0e6d2;
    --dombg: #f3ded5;
    --vinbg: #e2e6ea;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif;
  }
  main { max-width: 1540px; margin: 28px auto 20px; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 28px; font-weight: 700; fill: var(--fg); }
  .subtitle { font-size: 14px; fill: var(--muted); }
  .ptitle { font-size: 18px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 15px; font-weight: 700; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .chip { stroke: var(--line); stroke-width: 1; }
  .tchip { fill: var(--neutral); }
  .mchip { fill: #edf0f4; }
  .cell { fill: #f4f2ec; stroke: var(--line); stroke-width: 0.8; }
  .sline { stroke: var(--line); stroke-width: 1.2; }
  .fline { stroke: #b6b2a6; stroke-width: 0.8; }
  .dot { fill: #1f2937; }
  .edge { stroke: var(--dom); stroke-width: 2.2; fill: none; }
  .panel { fill: #ffffff; stroke: #d7d3c8; stroke-width: 1; }
  .roman { font-weight: 700; font-size: 20px; }
  .ch { font-weight: 800; font-size: 17px; }
</style>
