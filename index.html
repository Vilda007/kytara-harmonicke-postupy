<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Guitar Harmony</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon-180.png">
    <link rel="shortcut icon" href="favicon-32.png">
    <link rel="stylesheet" href="app.css">
    <style>
        :root {
            --bg: #faf9f5;
            --fg: #172033;
            --muted: #5b6475;
            --line: #64748b;
            --neutral: #e8e4d8;
            --tonic: #2f6b4f;
            --sub: #8a6d3b;
            --dom: #b04a2f;
            --vin: #5b6478;
            --tonicbg: #d8ecdf;
            --subbg: #f0e6d2;
            --dombg: #f3ded5;
            --vinbg: #e2e6ea;
        }
        body { background-color: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
        .chord-grid { stroke: var(--line); stroke-width: 1; }
        .fret-line { stroke: #b6b2a6; stroke-width: 0.8; }
        .string-line { stroke: var(--line); stroke-width: 1; }
        .chord-dot { fill: var(--fg); }
        .barre-rect { fill: var(--fg); opacity: 0.45; }
        .root-circle { fill: none; stroke: var(--tonic); stroke-width: 2; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>

    <script src="app.js"></script>
</body>
</html>
