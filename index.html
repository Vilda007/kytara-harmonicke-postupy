    <style>
        :root {
            --bg: #faf9f5;
            --fg: #172033;
            --muted: #5b6475;
            --line: #64748b;
            --neutral: #e8e4d8;
            --tonic: #2f6b4f;
            --sub: #8a6d3b;
            --dom: #b04a2f;
            --vin: #5b6478;
            --tonicbg: #d8ecdf;
            --subbg: #f0e6d2;
            --dombg: #f3ded5;
            --vinbg: #e2e6ea;
        }
        body { background-color: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
        .chord-grid { stroke: var(--line); stroke-width: 1; }
        .fret-line { stroke: #b6b2a6; stroke-width: 0.8; }
        .string-line { stroke: var(--line); stroke-width: 1; }
        .chord-dot { fill: var(--fg); }
        .barre-rect { fill: var(--fg); opacity: 0.45; }
        .root-circle { fill: none; stroke: var(--tonic); stroke-width: 2; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>

    <script src="app.v1.js"></script>

    <!-- Cookie consent (EU): GA loads only after an explicit choice; choice persists in localStorage -->
    <div id="cookieConsent" role="dialog" aria-label="Cookie consent" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#172033;color:#e8f1f4;padding:14px 20px;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem">
      <span>Používáme cookies pro anonymní statistiku návštěvnosti · We use cookies for anonymous traffic stats</span>
      <button id="cookieAccept" style="background:#e8a33d;color:#1c1206;border:0;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer">Přijmout / Accept</button>
      <button id="cookieDeny" style="background:transparent;color:#e8f1f4;border:1px solid #64748b;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer">Odmítnout / Deny</button>
    </div>
    <script>
      (function () {
        var banner = document.getElementById('cookieConsent');
        try {
          var saved = localStorage.getItem('kytara-cookie-consent');
          if (saved) return;              // volba už byla uložena — banner nezobrazovat
          banner.style.display = 'flex';
          function gtagLoad() {           // gtag.js + config až po explicitním souhlasu
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=G-TF5EBMGRYY';
            document.head.appendChild(s);
            gtag('js', new Date());
            gtag('config', 'G-TF5EBMGRYY');
          }
          function choose(val) {
            try { localStorage.setItem('kytara-cookie-consent', val); } catch (e) {}
            gtag('consent', 'update', { analytics_storage: val === 'granted' ? 'granted' : 'denied' });
            if (val === 'granted') gtagLoad();
            banner.style.display = 'none';
          }
          document.getElementById('cookieAccept').addEventListener('click', function () { choose('granted'); });
          document.getElementById('cookieDeny').addEventListener('click', function () { choose('denied'); });
        } catch (e) { /* localStorage nedostupný — statistiku nespouštěj */ }
      })();
    </script>
</body>
</html>
